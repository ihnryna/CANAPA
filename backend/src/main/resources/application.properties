spring.application.name=backend
spring.datasource.url=${CANAPA_DB_URL:jdbc:postgresql://localhost:5432/canapa}
spring.datasource.username=${CANAPA_DB_USERNAME:${user.name}}
spring.datasource.password=${CANAPA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CANAPA_MAIL_USERNAME:}
spring.mail.password=${CANAPA_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sending stays disabled until explicitly configured
canapa.mail.enabled=${CANAPA_MAIL_ENABLED:false}
